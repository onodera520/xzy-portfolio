<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">H5 运营活动占位视觉</title>
  <desc id="desc">暖橙、玫红和紫色构成的抽象渐变图形</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="0.48" stop-color="#e94d86"/>
      <stop offset="1" stop-color="#7139a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffd47c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd47c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="54"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <circle cx="320" cy="760" r="280" fill="#ffb16d" fill-opacity="0.5" filter="url(#blur)"/>
  <circle cx="1260" cy="690" r="360" fill="#b749cf" fill-opacity="0.5" filter="url(#blur)"/>
  <path d="M-80 760C250 520 450 900 770 650s520-210 910-40" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="4"/>
  <path d="M-30 820C300 580 500 960 820 710s520-210 900-40" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
