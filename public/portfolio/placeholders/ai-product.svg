<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI 产品占位视觉</title>
  <desc id="desc">深蓝、紫色与青色构成的抽象科技图形</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.52" stop-color="#32277f"/>
      <stop offset="1" stop-color="#087b89"/>
    </linearGradient>
    <radialGradient id="a" cx="0.72" cy="0.34" r="0.52">
      <stop offset="0" stop-color="#72f0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#72f0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="72"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#a)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="500" cy="670" rx="330" ry="250" fill="#7c5cff" fill-opacity="0.42" filter="url(#blur)"/>
  <g fill="none" stroke="#9cf8ff" stroke-opacity="0.3">
    <circle cx="1040" cy="470" r="170"/>
    <circle cx="1040" cy="470" r="260"/>
    <circle cx="1040" cy="470" r="350"/>
  </g>
  <g fill="#c7fbff">
    <circle cx="1040" cy="300" r="8"/><circle cx="1210" cy="470" r="8"/>
    <circle cx="870" cy="470" r="8"/><circle cx="1040" cy="640" r="8"/>
  </g>
</svg>
